[project]
name = "ebay-proj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fabian Seidl", email = "fabianseidl@fseidl.eu" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ebay-proj = "ebay_proj:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
# Ruff lints/formats Python code blocks inside Markdown; our docs quote
# upstream snippets verbatim, so keep them out of scope.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
